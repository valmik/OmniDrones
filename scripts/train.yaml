sim: ${task.sim}
env: ${task.env}

total_frames: 200_000_000
max_iters: -1
eval_interval: 500
major_eval_interval: 1000
save_interval: 100
seed: 0
render_during_minor_eval: true
render_during_major_eval: true

viewer:
  resolution: [640, 480]
  eye: [8, 0., 12.]
  lookat: [0., 0., 5.]

wandb:
  group: ${oc.select:..task.name}
  # run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-TRAIN
  run_name: tilt-as-quad-slalom-fast-new-reward # slalom-fast # hybrid-motor # test-train # ${oc.select:..task.drone_model.controller}-${oc.select:..algo.name,none}-windis-${oc.select:..task.wind,false}-TRAIN
  job_type: train
  entity: valmikp-rl
  project: slalom-fast # tiltrotor-test # slalom-fast # quadrotor-hybrid-control # tiltrotor-test # quadrotor-hybrid-control
  mode: online # set to 'disabled' when debugging locally
  run_id:
  monitor_gym: True
  tags:

major_eval_configs:
  slalom-short:
    env:
      max_episode_length: 600
      num_envs: 1
    task:
      traj_type: 'slalom'
      wind: false
    viewer:
      resolution: [1280, 960]
  slalom-long:
    env:
      max_episode_length: 3000
      num_envs: 1
    task:
      traj_type: 'slalom'
      wind: false
    viewer:
      resolution: [1280, 960]
