hydra:
  searchpath:
    # see https://hydra.cc/docs/advanced/search_path/
    - file://../cfg
  run:
    dir: outputs/${wandb.project}/${wandb.group}/${wandb.run_name}/${now:%Y-%m-%d_%H-%M-%S}

headless: true

checkpoint_path: /home/valmik/Documents/Research/drone_rl/OmniDrones/scripts/outputs/tiltrotor-test/TrackSimpleFlight/end-to-end-no-time-encoding-quad/2025-12-14_21-42-00/checkpoint_199901184.pt
